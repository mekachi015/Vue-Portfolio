services:
  # MongoDB Service
  mongodb:
    image: mongo:5.0
    container_name: portfolio-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: portfolio
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "27017:27017"
    networks:
      - portfolio-network

  # Backend Service (Spring Boot) - FIXED PATH
  backend:
    build: 
      context: ./Vue Backend/Portfolio-Backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/portfolio
      - SPRING_DATA_MONGODB_DATABASE=portfolio
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    networks:
      - portfolio-network

  # Frontend Service (Vue.js) - FIXED PATH
  frontend:
    build:
      context: ./Vue Frontend/portfolio
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  mongodb_data: